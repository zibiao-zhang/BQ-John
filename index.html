<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>John Bible Quizzing Practice</title>

  <style>
    :root {
      --blue: #2457a6;
      --blue-dark: #173d78;
      --light-blue: #eef4ff;

      --green: #16834b;
      --light-green: #effcf5;

      --red: #b42318;
      --light-red: #fff1f0;

      --gray: #667085;
      --dark: #17202a;
      --border: #d0d5dd;
      --background: #f7f9fc;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--dark);
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0 0 6px;
      color: var(--blue);
      font-size: 32px;
    }

    h2 {
      margin-top: 0;
      color: var(--blue-dark);
    }

    .subtitle {
      color: var(--gray);
      font-size: 14px;
    }

    .card {
      background: var(--white);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 4px 16px rgba(16, 24, 40, 0.08);
    }

    label {
      display: block;
      margin-top: 17px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    select,
    button {
      width: 100%;
      min-height: 46px;
      border-radius: 10px;
      font-size: 16px;
    }

    select {
      padding: 8px 10px;
      background: var(--white);
      color: var(--dark);
      border: 1px solid var(--border);
    }

    button {
      border: none;
      cursor: pointer;
      padding: 10px 14px;
      margin-top: 12px;
      font-weight: bold;
      transition: 0.15s ease;
    }

    button:hover {
      filter: brightness(0.96);
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .primary {
      background: var(--blue);
      color: white;
    }

    .primary:hover {
      background: var(--blue-dark);
    }

    .secondary {
      background: var(--light-blue);
      color: var(--blue);
    }

    .green {
      background: var(--green);
      color: white;
    }

    .red {
      background: var(--light-red);
      color: var(--red);
      border: 1px solid #f2b8b5;
    }

    .gray-button {
      background: #f2f4f7;
      color: #344054;
    }

    .hidden {
      display: none !important;
    }

    .reference-grid {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 12px;
    }

    .range-preview {
      padding: 14px;
      margin-top: 18px;
      border-radius: 10px;
      background: var(--light-blue);
      color: var(--blue);
      font-weight: bold;
      text-align: center;
      line-height: 1.5;
    }

    .small-note {
      margin-top: 14px;
      color: var(--gray);
      font-size: 13px;
      line-height: 1.5;
    }

    .status-box {
      padding: 13px;
      margin-top: 18px;
      border: 1px solid #eaecf0;
      border-radius: 10px;
      background: #f9fafb;
      color: #475467;
      font-size: 14px;
      line-height: 1.5;
    }

    .error-box {
      padding: 13px;
      margin-top: 16px;
      border: 1px solid #f2b8b5;
      border-radius: 10px;
      background: var(--light-red);
      color: var(--red);
      font-size: 14px;
      line-height: 1.5;
    }

    .question-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      color: var(--gray);
      font-size: 14px;
    }

    .correct-count {
      margin-left: 14px;
      color: var(--green);
      font-weight: bold;
    }

    .question-type {
      color: var(--blue);
      font-weight: bold;
      text-align: right;
    }

    .progress {
      width: 100%;
      height: 10px;
      margin: 12px 0 22px;
      overflow: hidden;
      border-radius: 10px;
      background: #e4e7ec;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: var(--blue);
      transition: width 0.25s ease;
    }

    .question {
      margin: 22px 0 12px;
      font-size: 24px;
      line-height: 1.45;
      font-weight: bold;
    }

    .reference {
      margin-top: 8px;
      color: var(--gray);
      font-size: 14px;
    }

    .answer {
      padding: 16px;
      margin-top: 18px;
      border-left: 5px solid var(--green);
      border-radius: 8px;
      background: var(--light-green);
      font-size: 19px;
      line-height: 1.5;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .score {
      margin: 22px 0;
      color: var(--blue);
      font-size: 50px;
      font-weight: bold;
      text-align: center;
    }

    .result-message {
      margin-bottom: 20px;
      font-size: 18px;
      line-height: 1.6;
      text-align: center;
    }

    .loading {
      color: var(--gray);
      text-align: center;
      font-size: 15px;
    }

    @media (max-width: 580px) {
      .app {
        padding: 12px;
      }

      .card {
        padding: 17px;
      }

      h1 {
        font-size: 27px;
      }

      .question {
        font-size: 21px;
      }

      .question-meta {
        align-items: flex-start;
        flex-direction: column;
      }

      .question-type {
        text-align: left;
      }

      .reference-grid,
      .button-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="app">

    <header>
      <h1>John Bible Quizzing</h1>
      <div class="subtitle">
        NIV Review Questions • John 1–21
      </div>
    </header>

    <!-- =========================
         SETUP SCREEN
    ========================== -->
    <section id="setupScreen" class="card">
      <h2>Practice Setup</h2>

      <label>Start Reference</label>

      <div class="reference-grid">
        <select id="startChapter" aria-label="Start chapter"></select>
        <select id="startVerse" aria-label="Start verse"></select>
      </div>

      <label>End Reference</label>

      <div class="reference-grid">
        <select id="endChapter" aria-label="End chapter"></select>
        <select id="endVerse" aria-label="End verse"></select>
      </div>

      <label for="questionCount">
        Number of Questions
      </label>

      <select id="questionCount">
        <option value="5">5</option>
        <option value="10">10</option>
        <option value="15">15</option>
        <option value="20" selected>20</option>
        <option value="25">25</option>
        <option value="30">30</option>
        <option value="50">50</option>
        <option value="all">All Available</option>
      </select>

      <div id="rangePreview" class="range-preview">
        Loading question range...
      </div>

      <button id="startButton" class="primary">
        Start Practice
      </button>

      <div id="availableCount" class="small-note"></div>

      <div id="setupError" class="error-box hidden"></div>

      <div class="status-box">
        Questions are selected randomly from the selected reference range.
        The question type will be displayed and read aloud before each question.
      </div>
    </section>

    <!-- =========================
         QUIZ SCREEN
    ========================== -->
    <section id="quizScreen" class="card hidden">

      <div class="question-meta">
        <div>
          <span id="questionNumber">
            Question 1 of 20
          </span>

          <span id="correctCount" class="correct-count">
            Correct: 0
          </span>
        </div>

        <span id="questionType" class="question-type"></span>
      </div>

      <div class="progress">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <div id="questionText" class="question"></div>

      <div id="questionReference" class="reference"></div>

      <div class="button-row">
        <button id="readQuestionButton" class="secondary">
          ?? Read Question
        </button>

        <button id="pauseButton" class="secondary">
          ? Pause
        </button>
      </div>

      <button id="showAnswerButton" class="primary">
        Show Answer
      </button>

      <div id="answerArea" class="hidden">
        <div id="answerText" class="answer"></div>

        <div id="answerReference" class="reference"></div>

        <button id="readAnswerButton" class="secondary">
          ?? Read Answer
        </button>

        <div class="button-row">
          <button id="knewButton" class="green">
            I Knew It
          </button>

          <button id="reviewButton" class="red">
            Need Review
          </button>
        </div>
      </div>

      <!-- This button can be used immediately after the child answers -->
      <button id="nextButton" class="primary">
        Next Question
      </button>
    </section>

    <!-- =========================
         RESULT SCREEN
    ========================== -->
    <section id="resultScreen" class="card hidden">
      <h2>Practice Complete</h2>

      <div id="scoreText" class="score">
        0 / 0
      </div>

      <div id="resultMessage" class="result-message"></div>

      <button id="restartButton" class="primary">
        Start Another Practice
      </button>
    </section>

  </main>

  <!-- =========================
       QUESTION BANK FILES
  ==========================

       Keep questions-01.js in the
       same folder as this file.
  -->
  <script src="questions-01.js"></script>
  <script src="questions-02.js"></script>
  <script src="questions-03.js"></script>
  <script src="questions-04.js"></script>
  <script src="questions-05.js"></script>
  <script src="questions-06.js"></script>
  <script src="questions-07.js"></script>
  <script src="questions-08.js"></script>
  <script src="questions-09.js"></script>
  <script src="questions-10.js"></script>
  <script src="questions-11.js"></script>
  <script src="questions-12.js"></script>
  <script src="questions-13.js"></script>
  <script src="questions-14.js"></script>
  <script src="questions-15.js"></script>
  <script src="questions-16.js"></script>
  <script src="questions-17.js"></script>
  <script src="questions-18.js"></script>
  <script src="questions-19.js"></script>
  <script src="questions-20.js"></script>
  <script src="questions-21.js"></script>




  <!-- Add these later when the files are created:
  -->

  <script>
    /*
      ==========================================
      QUESTION TYPE NAMES
      ==========================================
    */

    const TYPE_NAMES = {
      INT: "Interrogative Question",
      MA: "Multiple Answer",
      Q: "Quote the Verse",
      FTV: "Finish the Verse",
      FT: "Finish the Statement",
      FTN: "Finish the Next Portion",
      CR: "Chapter-only Reference",
      CVR: "Chapter-and-Verse Reference",
      SIT: "Situation Question",
      F2V: "Finish Two Verses",
      Q2V: "Quote Two Verses",
      CRMA: "Chapter Reference, Multiple Answer",
      CVRMA: "Chapter-and-Verse Reference, Multiple Answer"
    };

    /*
      ==========================================
      NUMBER OF VERSES IN EACH CHAPTER OF JOHN
      ==========================================
    */

    const CHAPTER_VERSES = {
      1: 51,
      2: 25,
      3: 36,
      4: 54,
      5: 47,
      6: 71,
      7: 53,
      8: 59,
      9: 41,
      10: 42,
      11: 57,
      12: 50,
      13: 38,
      14: 31,
      15: 27,
      16: 33,
      17: 26,
      18: 40,
      19: 42,
      20: 31,
      21: 25
    };

    /*
      ==========================================
      QUESTION BANK VALIDATION
      ==========================================
    */

    const QUESTION_BANK =
      Array.isArray(window.QUESTION_BANK)
        ? window.QUESTION_BANK
        : [];

    /*
      ==========================================
      APPLICATION STATE
      ==========================================
    */

    let selectedQuestions = [];
    let currentIndex = 0;
    let knownCount = 0;
    let reviewCount = 0;

    /*
      ==========================================
      DOM ELEMENTS
      ==========================================
    */

    const setupScreen =
      document.getElementById("setupScreen");

    const quizScreen =
      document.getElementById("quizScreen");

    const resultScreen =
      document.getElementById("resultScreen");

    const startChapter =
      document.getElementById("startChapter");

    const startVerse =
      document.getElementById("startVerse");

    const endChapter =
      document.getElementById("endChapter");

    const endVerse =
      document.getElementById("endVerse");

    const questionCount =
      document.getElementById("questionCount");

    const rangePreview =
      document.getElementById("rangePreview");

    const availableCount =
      document.getElementById("availableCount");

    const setupError =
      document.getElementById("setupError");

    const questionNumber =
      document.getElementById("questionNumber");

    const correctCount =
      document.getElementById("correctCount");

    const questionType =
      document.getElementById("questionType");

    const questionText =
      document.getElementById("questionText");

    const questionReference =
      document.getElementById("questionReference");

    const progressBar =
      document.getElementById("progressBar");

    const answerArea =
      document.getElementById("answerArea");

    const answerText =
      document.getElementById("answerText");

    const answerReference =
      document.getElementById("answerReference");

    const scoreText =
      document.getElementById("scoreText");

    const resultMessage =
      document.getElementById("resultMessage");

    /*
      ==========================================
      REFERENCE HELPERS
      ==========================================
    */

    function makeReference(chapter, verse) {
      return {
        chapter: Number(chapter),
        verse: Number(verse)
      };
    }

    function referencePosition(reference) {
      return reference.chapter * 1000 + reference.verse;
    }

    function getStartReference() {
      return makeReference(
        startChapter.value,
        startVerse.value
      );
    }

    function getEndReference() {
      return makeReference(
        endChapter.value,
        endVerse.value
      );
    }

    function getQuestionReference(question) {
      return makeReference(
        question.chapter,
        question.verse
      );
    }

    /*
      ==========================================
      POPULATE CHAPTER DROPDOWNS
      ==========================================
    */

    function populateChapterSelect(selectElement) {
      selectElement.innerHTML = "";

      for (let chapter = 1; chapter <= 21; chapter++) {
        const option =
          document.createElement("option");

        option.value = chapter;
        option.textContent = `John ${chapter}`;

        selectElement.appendChild(option);
      }
    }

    /*
      Populate verses according to selected chapter
    */

    function populateVerseSelect(
      selectElement,
      chapter,
      selectedVerse = 1
    ) {
      selectElement.innerHTML = "";

      const totalVerses =
        CHAPTER_VERSES[chapter];

      for (let verse = 1; verse <= totalVerses; verse++) {
        const option =
          document.createElement("option");

        option.value = verse;
        option.textContent = `Verse ${verse}`;

        selectElement.appendChild(option);
      }

      if (selectedVerse <= totalVerses) {
        selectElement.value = selectedVerse;
      }
    }

    /*
      Initial setup:
      Start = John 1:1
      End = John 21:25
    */

    function initializeSelectors() {
      populateChapterSelect(startChapter);
      populateChapterSelect(endChapter);

      startChapter.value = "1";
      endChapter.value = "21";

      populateVerseSelect(
        startVerse,
        1,
        1
      );

      populateVerseSelect(
        endVerse,
        21,
        25
      );

      updateRangeInfo();
    }

    /*
      ==========================================
      QUESTION FILTERING
      ==========================================
    */

    function getFilteredQuestions() {
      const start =
        getStartReference();

      const end =
        getEndReference();

      if (
        referencePosition(start) >
        referencePosition(end)
      ) {
        return [];
      }

      return QUESTION_BANK.filter(question => {
        const questionReference =
          getQuestionReference(question);

        const questionPosition =
          referencePosition(questionReference);

        return (
          questionPosition >=
            referencePosition(start) &&
          questionPosition <=
            referencePosition(end)
        );
      });
    }

    function updateRangeInfo() {
      const start =
        getStartReference();

      const end =
        getEndReference();

      if (
        referencePosition(start) >
        referencePosition(end)
      ) {
        rangePreview.textContent =
          "Invalid range: start must come before end.";

        availableCount.textContent = "";

        return;
      }

      const available =
        getFilteredQuestions().length;

      rangePreview.textContent =
        `Practice range: John ${start.chapter}:${start.verse} – ` +
        `John ${end.chapter}:${end.verse}`;

      const requested =
        questionCount.value === "all"
          ? "all available"
          : questionCount.value;

      if (available === 0) {
        availableCount.textContent =
          "No questions are available in this range.";
      } else {
        availableCount.textContent =
          `${available} question(s) available. ` +
          `Selected amount: ${requested}.`;
      }
    }

    /*
      ==========================================
      RANDOMIZATION
      ==========================================
    */

    function shuffle(array) {
      const copied =
        [...array];

      for (
        let index = copied.length - 1;
        index > 0;
        index--
      ) {
        const randomIndex =
          Math.floor(Math.random() * (index + 1));

        [
          copied[index],
          copied[randomIndex]
        ] = [
          copied[randomIndex],
          copied[index]
        ];
      }

      return copied;
    }

    /*
      ==========================================
      SPEECH FUNCTIONS
      ==========================================
    */

    function speechSupported() {
      return "speechSynthesis" in window;
    }

    function stopSpeaking() {
      if (speechSupported()) {
        window.speechSynthesis.cancel();
      }
    }

    function speak(text) {
      if (!speechSupported()) {
        alert(
          "Speech synthesis is not supported in this browser."
        );

        return;
      }

      stopSpeaking();

      const utterance =
        new SpeechSynthesisUtterance(text);

      utterance.lang = "en-US";
      utterance.rate = 0.85;
      utterance.pitch = 1.0;
      utterance.volume = 1.0;

      window.speechSynthesis.speak(utterance);
    }

    function spokenQuestionText(question) {
      const typeName =
        TYPE_NAMES[question.type] ||
        question.type;

      return `${typeName}. ${question.question}`;
    }

    /*
      ==========================================
      RENDER CURRENT QUESTION
      ==========================================
    */

    function renderQuestion() {
      const question =
        selectedQuestions[currentIndex];

      if (!question) {
        finishPractice();
        return;
      }

      const typeName =
        TYPE_NAMES[question.type] ||
        question.type;

      questionNumber.textContent =
        `Question ${currentIndex + 1} of ` +
        `${selectedQuestions.length}`;

      correctCount.textContent =
        `Correct: ${knownCount}`;

      questionType.textContent =
        `Type: ${question.type} — ${typeName}`;

      questionText.textContent =
        question.question;

      questionReference.textContent =
        `Reference: ${question.reference}`;

      answerText.textContent =
        question.answer;

      answerReference.textContent =
        `Reference: ${question.reference}`;

      answerArea.classList.add("hidden");

      /*
        Progress shows the current position.
      */

      const progress =
        (currentIndex /
          selectedQuestions.length) *
        100;

      progressBar.style.width =
        `${progress}%`;

      /*
        Automatically speak:
        1. Question type
        2. Question
      */

      window.setTimeout(() => {
        speak(
          spokenQuestionText(question)
        );
      }, 300);
    }

    /*
      ==========================================
      START PRACTICE
      ==========================================
    */

    function startPractice() {
      setupError.classList.add("hidden");
      setupError.textContent = "";

      const available =
        getFilteredQuestions();

      if (available.length === 0) {
        setupError.textContent =
          "There are no questions in this reference range.";

        setupError.classList.remove("hidden");

        return;
      }

      let requestedCount;

      if (questionCount.value === "all") {
        requestedCount =
          available.length;
      } else {
        requestedCount =
          Number(questionCount.value);
      }

      const actualCount =
        Math.min(
          requestedCount,
          available.length
        );

      selectedQuestions =
        shuffle(available)
          .slice(0, actualCount);

      currentIndex = 0;
      knownCount = 0;
      reviewCount = 0;

      correctCount.textContent =
        "Correct: 0";

      setupScreen.classList.add("hidden");
      resultScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");

      renderQuestion();
    }

    /*
      ==========================================
      NEXT QUESTION
      ==========================================
    */

    function moveToNextQuestion() {
      stopSpeaking();

      currentIndex++;

      if (
        currentIndex >=
        selectedQuestions.length
      ) {
        finishPractice();
        return;
      }

      renderQuestion();
    }

    /*
      ==========================================
      MARK QUESTION RESULT
      ==========================================
    */

    function finishQuestion(result) {
      if (result === "known") {
        knownCount++;
      }

      if (result === "review") {
        reviewCount++;
      }

      correctCount.textContent =
        `Correct: ${knownCount}`;

      moveToNextQuestion();
    }

    /*
      ==========================================
      FINISH PRACTICE
      ==========================================
    */

    function finishPractice() {
      stopSpeaking();

      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");

      const total =
        selectedQuestions.length;

      const skipped =
        total -
        knownCount -
        reviewCount;

      const percentage =
        total === 0
          ? 0
          : Math.round(
              (knownCount / total) * 100
            );

      scoreText.textContent =
        `${knownCount} / ${total}`;

      resultMessage.innerHTML =
        `Score: <strong>${percentage}%</strong><br>` +
        `Need Review: <strong>${reviewCount}</strong><br>` +
        `Skipped: <strong>${skipped}</strong>`;
    }

    /*
      ==========================================
      EVENT LISTENERS
      ==========================================
    */

    startChapter.addEventListener(
      "change",
      () => {
        populateVerseSelect(
          startVerse,
          Number(startChapter.value),
          1
        );

        updateRangeInfo();
      }
    );

    endChapter.addEventListener(
      "change",
      () => {
        const chapter =
          Number(endChapter.value);

        const lastVerse =
          CHAPTER_VERSES[chapter];

        populateVerseSelect(
          endVerse,
          chapter,
          lastVerse
        );

        updateRangeInfo();
      }
    );

    startVerse.addEventListener(
      "change",
      updateRangeInfo
    );

    endVerse.addEventListener(
      "change",
      updateRangeInfo
    );

    questionCount.addEventListener(
      "change",
      updateRangeInfo
    );

    document
      .getElementById("startButton")
      .addEventListener(
        "click",
        startPractice
      );

    document
      .getElementById("showAnswerButton")
      .addEventListener(
        "click",
        () => {
          const question =
            selectedQuestions[currentIndex];

          if (!question) {
            return;
          }

          answerArea.classList.remove("hidden");

          speak(question.answer);
        }
      );

    document
      .getElementById("readQuestionButton")
      .addEventListener(
        "click",
        () => {
          const question =
            selectedQuestions[currentIndex];

          if (!question) {
            return;
          }

          speak(
            spokenQuestionText(question)
          );
        }
      );

    document
      .getElementById("readAnswerButton")
      .addEventListener(
        "click",
        () => {
          const question =
            selectedQuestions[currentIndex];

          if (!question) {
            return;
          }

          speak(question.answer);
        }
      );

    document
      .getElementById("pauseButton")
      .addEventListener(
        "click",
        stopSpeaking
      );

    document
      .getElementById("knewButton")
      .addEventListener(
        "click",
        () => {
          finishQuestion("known");
        }
      );

    document
      .getElementById("reviewButton")
      .addEventListener(
        "click",
        () => {
          finishQuestion("review");
        }
      );

    /*
      Next Question:
      This does not add to Correct
      or Need Review.
    */

    document
      .getElementById("nextButton")
      .addEventListener(
        "click",
        moveToNextQuestion
      );

    document
      .getElementById("restartButton")
      .addEventListener(
        "click",
        () => {
          stopSpeaking();

          resultScreen.classList.add("hidden");
          setupScreen.classList.remove("hidden");

          updateRangeInfo();
        }
      );

    /*
      ==========================================
      INITIALIZE APP
      ==========================================
    */

    if (QUESTION_BANK.length === 0) {
      setupError.textContent =
        "No question bank was loaded. Make sure questions-01.js is in the same folder as BQ_practice.html.";

      setupError.classList.remove("hidden");
    }

    initializeSelectors();
  </script>
</body>
</html>
